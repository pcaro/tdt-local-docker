services:
  tdt-local:
    image: ghcr.io/pcaro/tdt-local-docker:1.3.0
    # Para construirla en tu equipo: comenta "image" y descomenta
    # "build".
    # build:
    #   context: .
    container_name: tdt-local
    ports:
      - "8788:8788"
    volumes:
      - ./data:/data
    environment:
      # Sin whisper ni llama.cpp: apagados para que no los busque.
      # Cualquier ajuste de «Ajustes» se fija así:
      # TDT_<NOMBRE_DEL_AJUSTE_EN_MAYUSCULAS>
      TDT_AI_ENABLED: "0"
      TDT_STT_ENABLED: "0"
    restart: unless-stopped
